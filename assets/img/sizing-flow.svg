<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">Array and battery sizing flow</title>
  <desc id="sf-desc">Daily watt-hours are divided by sun hours, then by 0.86, then rounded up to the next 100 watts. Battery watt-hours are daily watt-hours times days divided by depth of discharge.</desc>
  <rect width="640" height="420" fill="#f4f5f7"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#1c1f24">
    <rect x="150" y="16" width="340" height="52" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="48" text-anchor="middle" font-size="18">Daily watt-hours</text>
    <text x="320" y="92" text-anchor="middle" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="120" y="104" width="400" height="52" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="136" text-anchor="middle" font-size="18">&#247; sun hours</text>
    <text x="320" y="180" text-anchor="middle" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="120" y="192" width="400" height="52" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="224" text-anchor="middle" font-size="18">&#247; 0.86</text>
    <text x="320" y="268" text-anchor="middle" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="90" y="280" width="460" height="52" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="312" text-anchor="middle" font-size="18">Round up to the next 100 W</text>
    <text x="320" y="356" text-anchor="middle" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="170" y="364" width="300" height="44" rx="8" fill="#1c1f24"/>
    <text x="320" y="392" text-anchor="middle" font-size="18" fill="#f4f5f7">Array watts</text>
  </g>
</svg>
