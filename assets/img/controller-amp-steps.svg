<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">Charge controller steps for 700 watts at 12 volts</title>
  <desc id="cc-desc">700 watts divided by 12 volts divided by 0.85 prints 68.6 amps. The listed size is 80 amps.</desc>
  <rect width="640" height="400" fill="#f4f5f7"/>
  <g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="160" y="16" width="320" height="48" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="46" font-size="18" fill="#1c1f24">700 W array</text>
    <text x="320" y="88" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="140" y="100" width="360" height="48" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="130" font-size="18" fill="#1c1f24">&#247; 12 V battery</text>
    <text x="320" y="172" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="170" y="184" width="300" height="48" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="214" font-size="18" fill="#1c1f24">&#247; 0.85</text>
    <text x="320" y="256" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="150" y="268" width="340" height="48" rx="8" fill="#fff" stroke="#1c1f24"/>
    <text x="320" y="298" font-size="18" fill="#1c1f24">68.6 A printed</text>
    <text x="320" y="340" font-size="22" fill="#5c6570">&#8595;</text>
    <rect x="130" y="348" width="380" height="40" rx="8" fill="#1c1f24"/>
    <text x="320" y="374" font-size="18" fill="#f4f5f7">80 A listed size</text>
  </g>
</svg>
